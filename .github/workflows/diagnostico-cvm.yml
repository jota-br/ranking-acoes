name: Diagnostico CVM
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e ler dados da CVM
        run: |
          python3 - <<'PY'
          import csv, io, json, os, sys, urllib.request, zipfile, datetime
          BASE = os.environ.get("CVM_BASE", "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC")
          TESTE = {"VIVA3": "lucro 12m ~585,8 mi", "DIRR3": "lucro 12m ~856,0 mi", "CURY3": "lucro 12m ~1098,0 mi", "ITUB4": "PL ~219.894 mi"}
          out = []
          def p(*a):
              s = " ".join(str(x) for x in a); print(s); out.append(s)
          def baixar(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = urllib.request.urlopen(req, timeout=180).read()
                  p("OK", url, f"{len(data)/1e6:.1f} MB"); return data
              except Exception as e:
                  p("FALHOU", url, repr(e)[:160]); return None
          def zip_de(prefixo, tipo, anos):
              for y in anos:
                  d = baixar(f"{BASE}/{tipo}/DADOS/{prefixo}_{y}.zip")
                  if d: return y, zipfile.ZipFile(io.BytesIO(d))
              return None, None
          def rows(z, trecho):
              nomes = [n for n in z.namelist() if trecho.lower() in n.lower()]
              if not nomes: return [], None
              n = nomes[0]
              txt = z.read(n).decode("latin-1")
              rd = csv.DictReader(io.StringIO(txt), delimiter=";")
              rd.fieldnames = [h.strip().upper() for h in rd.fieldnames]
              return list(rd), n
          def esc(r):
              e = (r.get("ESCALA_MOEDA") or "").upper()
              return 1000.0 if e.startswith("MIL") else (1e6 if e.startswith("MILH") else 1.0)
          def val(r):
              try: return float(r["VL_CONTA"].replace(",", ".")) * esc(r) / 1e6
              except Exception: return None
          p("== Diagnostico CVM", datetime.date.today().isoformat(), "==")
          yf, zf = zip_de("fca_cia_aberta", "FCA", [2026, 2025])
          yd, zd = zip_de("dfp_cia_aberta", "DFP", [2025, 2024])
          yi, zi = zip_de("itr_cia_aberta", "ITR", [2026, 2025])
          for nome, z in (("FCA", zf), ("DFP", zd), ("ITR", zi)):
              if z: p(f"Arquivos no zip {nome}:", ", ".join(z.namelist()[:40]))
          if not (zf and zd and zi):
              p("Faltou baixar algum arquivo; ver linhas FALHOU acima."); open("diagnostico-cvm.md", "w", encoding="utf-8").write("```\n" + "\n".join(out) + "\n```\n"); sys.exit(0)
          vm, nvm = rows(zf, "valor_mobiliario")
          p("FCA valor mobiliario:", nvm, "| colunas:", list(vm[0].keys()) if vm else "nenhuma")
          col_t = next((c for c in (vm[0] if vm else {}) if "CODIGO_NEGOCIACAO" in c), None)
          col_c = next((c for c in (vm[0] if vm else {}) if c.startswith("CNPJ")), None)
          mapa = {}
          for r in vm:
              t = (r.get(col_t) or "").strip().upper()
              if t in TESTE: mapa.setdefault(t, r.get(col_c))
          p("Tickers encontrados no FCA:", mapa)
          dre_d, n1 = rows(zd, "_DRE_con"); bpp_d, n2 = rows(zd, "_BPP_con")
          dre_i, n3 = rows(zi, "_DRE_con"); bpp_i, n4 = rows(zi, "_BPP_con"); cap_i, n5 = rows(zi, "composicao_capital")
          p("Arquivos usados:", n1, n2, n3, n4, n5)
          def melhor(rs, cnpj, conta, ordem, ini=None, fim=None):
              res = None
              for r in rs:
                  if r.get("CNPJ_CIA") != cnpj or r.get("CD_CONTA") != conta or (r.get("ORDEM_EXERC") or "").upper().replace("Ú", "U") != ordem: continue
                  if ini and r.get("DT_INI_EXERC") != ini: continue
                  if fim and r.get("DT_FIM_EXERC") != fim: continue
                  v = int(r.get("VERSAO") or 0)
                  if res is None or v >= res[0]: res = (v, val(r), r)
              return res
          for t, esperado in TESTE.items():
              p(f"\n--- {t} (referencia: {esperado}) ---")
              cnpj = mapa.get(t)
              if not cnpj: p("sem CNPJ no FCA"); continue
              nome = next((r["DENOM_CIA"] for r in dre_d if r.get("CNPJ_CIA") == cnpj), "?")
              p("CNPJ", cnpj, "|", nome)
              for conta in ("3.11.01", "3.11"):
                  fy = melhor(dre_d, cnpj, conta, "ULTIMO", fim=f"{yd}-12-31")
                  if fy and fy[1] is not None: break
              p(f"DFP {yd}: lucro (conta {conta}) = {fy[1]:.1f} mi" if fy and fy[1] is not None else "DFP: lucro nao encontrado")
              datas = sorted({r["DT_REFER"] for r in dre_i if r.get("CNPJ_CIA") == cnpj})
              if not datas: p("ITR: sem dados para esse CNPJ"); ltm = None
              else:
                  ref = datas[-1]; ano = int(ref[:4])
                  cur = melhor(dre_i, cnpj, conta, "ULTIMO", ini=f"{ano}-01-01", fim=ref)
                  prev_fim = f"{ano-1}{ref[4:]}"
                  prv = melhor(dre_i, cnpj, conta, "PENULTIMO", ini=f"{ano-1}-01-01", fim=prev_fim)
                  p(f"ITR ate {ref}: acumulado do ano = {cur[1] if cur else None} mi | mesmo periodo do ano anterior = {prv[1] if prv else None} mi")
                  ltm = fy[1] + cur[1] - prv[1] if fy and cur and prv and None not in (fy[1], cur[1], prv[1]) else None
                  p("Lucro dos ultimos 12 meses (CVM) =", f"{ltm:.1f} mi" if ltm is not None else "nao calculado")
              capr = [r for r in cap_i if r.get("CNPJ_CIA") == cnpj]
              if capr:
                  c = sorted(capr, key=lambda r: (r.get("DT_REFER"), r.get("VERSAO")))[-1]
                  p("Composicao do capital:", {k: v for k, v in c.items() if k.startswith("QT_") or k == "DT_REFER"})
              else: p("Composicao do capital: nao encontrada")
              pl = None
              for conta_pl in ("2.03.01", "2.03"):
                  pl = melhor(bpp_i, cnpj, conta_pl, "ULTIMO", fim=(datas[-1] if datas else None))
                  if pl and pl[1] is not None: break
              p("Patrimonio liquido (conta", conta_pl + ") =", f"{pl[1]:.1f} mi" if pl and pl[1] is not None else "nao encontrado")
          p("\n== Fim do diagnostico ==")
          open("diagnostico-cvm.md", "w", encoding="utf-8").write("```\n" + "\n".join(out) + "\n```\n")
          PY
      - name: Salvar o relatorio
        run: |
          git config user.name "diagnostico-bot"
          git config user.email "diagnostico-bot@users.noreply.github.com"
          git add diagnostico-cvm.md
          git diff --cached --quiet || (git commit -m "Diagnostico CVM" && git pull --rebase && git push)
