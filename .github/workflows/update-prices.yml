name: Atualizar precos
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar precos na brapi
        env:
          TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, datetime, zoneinfo
          T = "VIVA3 DIRR3 MDNE3 MOVI3 CYRE3 RIAA3 EZTC3 JHSF3 ALOS3 TOTS3 ASAI3 BBAS3 SMAL11 RAIL3 LEVE3 BBDC4 VLID3 MOTV3 RENT3 HYPE3".split()
          base = os.environ.get("BASE", "https://brapi.dev/api/quote/")
          tok = os.environ["TOKEN"]
          pause = float(os.environ.get("PAUSE", "1"))
          new, erros = {}, []
          for t in T:
              try:
                  req = urllib.request.Request(base + t, headers={"Authorization": "Bearer " + tok, "User-Agent": "Mozilla/5.0"})
                  d = json.loads(urllib.request.urlopen(req, timeout=30).read().decode("utf-8"))
                  v = float(d["results"][0]["regularMarketPrice"])
                  if v > 0:
                      new[t] = v
              except Exception as e:
                  erros.append(t)
              time.sleep(pause)
          old = json.load(open("prices.json", encoding="utf-8"))
          prices = dict(old["prices"])
          bad = []
          for t, v in new.items():
              o = prices.get(t)
              if o and abs(v / o - 1) > 0.25:
                  bad.append(t)
                  continue
              prices[t] = round(v, 2)
          changed = prices != old["prices"]
          date = datetime.datetime.now(zoneinfo.ZoneInfo("America/Sao_Paulo")).strftime("%d/%m/%Y")
          if changed:
              json.dump({"date": date, "prices": prices}, open("prices.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print("lidos:", len(new), "| sem resposta:", erros, "| descartados (variacao >25%):", bad, "| alterou:", changed)
          PY
      - name: Salvar se mudou
        run: |
          git config user.name "precos-bot"
          git config user.email "precos-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Atualiza precos" && git push)
